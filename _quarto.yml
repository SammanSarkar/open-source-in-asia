project:
  type: website
  output-dir: docs
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Asian Open Source Communities"
  site-url: "https://sammansarkar.github.io/open-source-in-asia"
  repo-url: "https://github.com/SammanSarkar/open-source-in-asia"
  repo-actions: [edit, issue]
  navbar:
    background: "#2c3e50"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Communities"
        href: communities/index.qmd
      - text: "Contribute"
        href: CONTRIBUTING.md
    right:
      - icon: github
        href: https://github.com/SammanSarkar/open-source-in-asia
      - text: "About"
        href: about.qmd
  page-navigation: true
  search: true

format:
  html:
    theme: cosmo
    css: 
      - styles/custom.css
      - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css
    toc: true
    toc-location: right
    code-fold: true
    code-tools: true
    include-after-body: footer.html
    mainfont: "Segoe UI, system-ui, -apple-system, sans-serif"
    highlight-style: github
    html-math-method: katex
    self-contained: false
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px

execute:
  freeze: auto 